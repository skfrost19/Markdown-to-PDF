<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Gradients for 3D depth -->
    <linearGradient id="mdGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667EEA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764BA2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="pdfGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F093FB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5576C;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4FACFE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00F2FE;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadows -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with glassmorphism effect -->
  <circle cx="128" cy="128" r="120" fill="url(#mdGradient)" opacity="0.1" filter="url(#glow)"/>
  
  <!-- Markdown Document (Left) -->
  <g filter="url(#shadow)">
    <!-- Document base with 3D effect -->
    <path d="M 35 80 L 35 176 C 35 180 37 182 41 182 L 95 182 C 99 182 101 180 101 176 L 101 95 L 86 80 Z" 
          fill="url(#mdGradient)" 
          opacity="0.9"/>
    
    <!-- Folded corner with depth -->
    <path d="M 86 80 L 86 92 C 86 94 88 95 90 95 L 101 95 Z" 
          fill="url(#mdGradient)" 
          opacity="0.6"/>
    
    <!-- Markdown "M↓" symbol with modern styling -->
    <g transform="translate(50, 115)">
      <path d="M 3 5 L 3 30 L 8 30 L 8 13 L 15 23 L 22 13 L 22 30 L 27 30 L 27 5 L 22 5 L 15 18 L 8 5 Z" 
            fill="white" 
            opacity="0.95"/>
      
      <!-- Down arrow integrated -->
      <path d="M 12 26 L 12 38 M 8 34 L 12 38 L 16 34" 
            fill="none" 
            stroke="white" 
            stroke-width="2.5" 
            stroke-linecap="round" 
            stroke-linejoin="round"
            opacity="0.95"/>
    </g>
    
    <!-- Decorative lines (document texture) -->
    <line x1="45" y1="158" x2="75" y2="158" stroke="white" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
    <line x1="45" y1="167" x2="85" y2="167" stroke="white" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  </g>
  
  <!-- Animated Arrow (Center) with glow -->
  <g filter="url(#glow)">
    <path d="M 110 128 L 140 128 M 133 121 L 145 128 L 133 135" 
          fill="none" 
          stroke="url(#arrowGradient)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0,0; 8,0; 0,0"
        dur="1.5s"
        repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- PDF Document (Right) with 3D depth -->
  <g filter="url(#shadow)">
    <!-- Document base -->
    <path d="M 155 80 L 155 176 C 155 180 157 182 161 182 L 215 182 C 219 182 221 180 221 176 L 221 95 L 206 80 Z" 
          fill="url(#pdfGradient)" 
          opacity="0.95"/>
    
    <!-- Folded corner with lighting -->
    <path d="M 206 80 L 206 92 C 206 94 208 95 210 95 L 221 95 Z" 
          fill="url(#pdfGradient)" 
          opacity="0.7"/>
    
    <!-- PDF Badge with modern design -->
    <rect x="165" y="118" width="46" height="26" rx="6" fill="white" opacity="0.25"/>
    <text x="188" y="135" 
          font-family="'SF Pro Display', -apple-system, system-ui, sans-serif" 
          font-size="14" 
          font-weight="700" 
          fill="white" 
          text-anchor="middle"
          letter-spacing="0.5">PDF</text>
    
    <!-- Decorative lines (document texture) -->
    <line x1="165" y1="156" x2="205" y2="156" stroke="white" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <line x1="165" y1="165" x2="200" y2="165" stroke="white" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  </g>
  
  <!-- Floating particles for modern touch -->
  <circle cx="50" cy="60" r="2" fill="#667EEA" opacity="0.4">
    <animate attributeName="cy" values="60;55;60" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="210" cy="65" r="2.5" fill="#F5576C" opacity="0.5">
    <animate attributeName="cy" values="65;60;65" dur="2.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="128" cy="200" r="2" fill="#4FACFE" opacity="0.4">
    <animate attributeName="cy" values="200;195;200" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>